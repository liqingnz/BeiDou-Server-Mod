name: 构建并推送镜像

# 手动触发，或推到 master 时自动构建。
# 只改文档/markdown 不触发，省 Actions 额度。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action 会自动把仓库名转成全小写（GHCR 要求）
      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          # 上下文是仓库根目录，Dockerfile 在 deploy/ 下
          context: .
          file: ./deploy/Dockerfile
          # 服务器是 arm64 的话改成 linux/arm64，或写成
          # linux/amd64,linux/arm64 出多架构清单（构建时间翻倍）
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 跨次构建复用层缓存。wz 那 561 MB 的层只在 wz 真的变了时才重建。
          cache-from: type=gha
          cache-to: type=gha,mode=max
